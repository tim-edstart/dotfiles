# ~/.tmux.conf — tmux 3.2+. IntelliJ Dark colours, a status bar that shows where you are,
# window names that say what runs where, and `dev` (bin/dev) one key away.

set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:RGB'
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Claude Code: clipboard passthrough, notifications, multiline ---
# allow-passthrough lets clipboard escape sequences (e.g. /copy), desktop
#   notifications and the progress bar reach the outer terminal instead of
#   being swallowed by tmux.
# extended-keys lets tmux distinguish Shift+Enter from Enter for newlines.
# NOTE: image paste itself is Ctrl+V (Claude reads the system clipboard
#   directly); Cmd+V only pastes images in iTerm2, not Apple Terminal.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# --- Mouse ---
# Drag pane dividers to resize, click to focus a pane, scroll to view history.
set -g mouse on

# --- Keys ---
# prefix + t  dev command center (live task status; r runs one, q closes)
# prefix + T  pick a task to run
# prefix + |  split right, prefix + -  split below (both keep the directory)
bind t display-popup -E -w 90% -h 85% -d '#{pane_current_path}' '~/.dotfiles/bin/dev top'
bind T display-popup -E -w 70% -h 60% -d '#{pane_current_path}' '~/.dotfiles/bin/dev run; sleep 1.5'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display 'tmux.conf reloaded'

# --- Names and titles ---
# Window name: the directory, plus the program when one other than the shell runs
#   e.g. "platform", "platform:nvim", "servers:java".
# Pane title (on pane borders when a window is split): set by the shell to
#   "dir ❯ command" and by nvim to the file it edits.
# Terminal title: "session · window".
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{b:pane_current_path}:#{pane_current_command}}'
setw -g allow-rename off
set -g set-titles on
set -g set-titles-string '#S · #W'
set -g pane-border-status off
set -g pane-border-format '#[fg=#6F737A] #{pane_index} #{?pane_active,#[fg=#DFE1E5#,bold],}#{pane_title} '
set-hook -g after-split-window 'set -w pane-border-status top'
set-hook -g pane-exited 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off"'
set-hook -g after-kill-pane 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off"'

# --- Status bar: session | windows … nvim line blame | directory | git branch | clock ---
# Powerline separators need a Nerd Font in the terminal (MesloLGS NF).
set -g status-interval 5
set -g status-style 'bg=#2B2D30,fg=#DFE1E5'
set -g status-left-length 40
set -g status-left '#[fg=#2B2D30,bg=#548AF7,bold] #S #[fg=#548AF7,bg=#2B2D30] '
set -g window-status-separator ''
set -g window-status-format '#[fg=#6F737A,bg=#2B2D30] #I #W '
set -g window-status-current-format '#[fg=#2B2D30,bg=#2E436E]#[fg=#DFE1E5,bg=#2E436E,bold] #I #W #[fg=#2E436E,bg=#2B2D30]'
set -g window-status-activity-style 'fg=#F2C55C'
set -g status-right-length 250
set -g status-right '#{?@nvim_blame,#[fg=#BCBEC4] #{=|-90|…:@nvim_blame} ,}#[fg=#393B40,bg=#2B2D30]#[fg=#DFE1E5,bg=#393B40] #{=|-60|…:#{s|#{HOME}|~|:pane_current_path}} #[fg=#CF8E6D,bg=#393B40]#[fg=#2B2D30,bg=#CF8E6D,bold] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "no git") #[fg=#548AF7,bg=#CF8E6D]#[fg=#2B2D30,bg=#548AF7,bold] %H:%M %d-%b '

# --- Colours elsewhere ---
set -g pane-border-style 'fg=#393B40'
set -g pane-active-border-style 'fg=#548AF7'
set -g message-style 'bg=#393B40,fg=#DFE1E5'
set -g mode-style 'bg=#2E436E,fg=#DFE1E5'
set -g popup-border-style 'fg=#548AF7'
setw -g clock-mode-colour '#548AF7'

# --- Session persistence (survive restarts / accidental closes) ---
# Managed by TPM (tmux plugin manager). Install/update with:  prefix + I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect: save/restore sessions, windows, panes, layouts.
#   prefix + Ctrl-s  save    |    prefix + Ctrl-r  restore
set -g @resurrect-capture-pane-contents 'on'   # restore scrollback/pane contents
set -g @resurrect-processes 'nvim'             # relaunch nvim on restore (auto-session reopens files)

# tmux-continuum: automate resurrect — auto-save every 15 min, auto-restore on server start.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Keep this line at the very bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
