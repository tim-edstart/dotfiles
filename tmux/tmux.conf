set -g default-terminal "screen-256color"

# --- Mouse ---
# Drag pane dividers to resize, click to focus a pane, scroll to view history.
set -g mouse on

# --- Status bar ---
# Update status bar every 5 seconds
set -g status-interval 5

# Show git branch on the right side of the status bar
set -g status-right '#[fg=colour214]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "no git") #[fg=white]| %H:%M %d-%b'
set -g status-right-length 60

# Left side: session name
set -g status-left '#[fg=colour39][#S] '
set -g status-left-length 30

# --- Window/pane naming ---
# Automatically rename windows to the running command
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

# Allow programs to set the window title
set -g set-titles on
set -g set-titles-string '#W - #{pane_current_command}'
setw -g allow-rename on

# --- Styling ---
set -g status-style 'bg=colour235,fg=colour250'
set -g window-status-current-format '#[fg=colour39,bold] #I:#W '
set -g window-status-format ' #I:#W '

# --- Session persistence (survive restarts / accidental closes) ---
# Managed by TPM (tmux plugin manager). Install/update with:  prefix + I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect: save/restore sessions, windows, panes, layouts.
#   prefix + Ctrl-s  save    |    prefix + Ctrl-r  restore
set -g @resurrect-capture-pane-contents 'on'   # restore scrollback/pane contents
set -g @resurrect-processes 'nvim'             # relaunch nvim on restore (auto-session reopens files)

# tmux-continuum: automate resurrect — auto-save every 15 min, auto-restore on server start.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Keep this line at the very bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
