set -g default-terminal "screen-256color"

# --- Claude Code: clipboard passthrough, notifications, multiline ---
# allow-passthrough lets clipboard escape sequences (e.g. /copy), desktop
#   notifications and the progress bar reach the outer terminal instead of
#   being swallowed by tmux.
# extended-keys lets tmux distinguish Shift+Enter from Enter for newlines.
# NOTE: image paste itself is Ctrl+V (Claude reads the system clipboard
#   directly); Cmd+V only pastes images in iTerm2, not Apple Terminal.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# --- Mouse ---
# Drag pane dividers to resize, click to focus a pane, scroll to view history.
set -g mouse on

# --- Status bar ---
# Powerline segments: session | windows ... pwd | git branch | clock.
# The separators need a Nerd Font in the terminal (MesloLGS NF).
set -g status-interval 5
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left-length 40
set -g status-left '#[fg=colour235,bg=colour39,bold] #S #[fg=colour39,bg=colour235] '
set -g status-right-length 150
set -g status-right '#[fg=colour238,bg=colour235]#[fg=colour250,bg=colour238] #{=|-60|…:#{s|#{HOME}|~|:pane_current_path}} #[fg=colour214,bg=colour238]#[fg=colour235,bg=colour214,bold] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "no git") #[fg=colour39,bg=colour214]#[fg=colour235,bg=colour39,bold] %H:%M %d-%b '

# --- Window/pane naming ---
# Automatically rename windows to the running command
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

# Allow programs to set the window title
set -g set-titles on
set -g set-titles-string '#W - #{pane_current_command}'
setw -g allow-rename on

# --- Styling ---
set -g window-status-separator ''
set -g window-status-format '#[fg=colour250,bg=colour235] #I:#W '
set -g window-status-current-format '#[fg=colour235,bg=colour250]#[fg=colour235,bg=colour250,bold] #I:#W #[fg=colour250,bg=colour235]'

# --- Session persistence (survive restarts / accidental closes) ---
# Managed by TPM (tmux plugin manager). Install/update with:  prefix + I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect: save/restore sessions, windows, panes, layouts.
#   prefix + Ctrl-s  save    |    prefix + Ctrl-r  restore
set -g @resurrect-capture-pane-contents 'on'   # restore scrollback/pane contents
set -g @resurrect-processes 'nvim'             # relaunch nvim on restore (auto-session reopens files)

# tmux-continuum: automate resurrect — auto-save every 15 min, auto-restore on server start.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Keep this line at the very bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
